<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Asset Preview</title>
  </head>
  <body>
    <main id="app">
      <section class="panel">
        <p class="eyebrow">Minecraft 3D Asset Preview</p>
        <h1>Preview generated Minecraft model assets before approval.</h1>
        <p class="intro">
          Upload a Java Edition model JSON file, optionally add texture images, and inspect whether the generated asset is valid and visually close to the request.
        </p>

        <label class="dropzone">
          <span>Model JSON</span>
          <input id="model-file" type="file" accept=".json,application/json" />
        </label>

        <label class="dropzone">
          <span>Texture images</span>
          <input id="texture-files" type="file" accept="image/png,image/jpeg" multiple />
        </label>

        <div id="status" class="status">Load a model JSON file to begin.</div>
        <dl id="summary" class="summary"></dl>
      </section>

      <section class="viewer-card">
        <canvas id="viewer" aria-label="3D Minecraft asset preview"></canvas>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
